# Task definitions. Tasks are intentionally NOT bound to an agent: the manager
# LLM (Process.hierarchical) decides who executes each one and delegates.
research_task:
  name: "research_task"
  description: >
    Delegate to the Market Research Specialist. Research "{query}" for calendar
    Q3 2026 (July 1 through September 30). Call the Web Search and Scrape tool
    exactly once. It queries Tavily for six companies, aligns each company's
    fiscal reporting period, prioritizes official sources, and saves the
    source-backed financial facts to the run CSV. Do not call other search
    queries or try to write another CSV. Return a concise summary of the saved
    facts and the source URLs. Unsupported fields remain blank.
  expected_output: >
    Confirmation of the current run's saved metrics CSV, the fiscal period
    used for each company, a concise research summary, and source URLs.

analysis_task:
  name: "analysis_task"
  description: >
    Delegate to the Financial Data Analyst. Load the source-backed CSV saved
    by the research task and run the "Calculate Financial Metrics" tool exactly
    once on its path. Verify numeric consistency (missing values, duplicates,
    negative or implausible numbers) and interpret the mean, min, max and
    standard deviation of every metric.
  expected_output: >
    The Markdown statistics table returned by the tool, followed by a short
    list of data-quality findings and 3-5 analytical observations.

writing_task:
  name: "writing_task"
  description: >
    Delegate to the Technical Reports Writer.
    Write the final market report for "{query}" in Markdown, using ONLY the
    research notes and statistics from the previous tasks. Required sections
    (use "##" headings): Executive Summary, Market Overview, Key Financial
    Metrics (embed the statistics table), Analysis & Insights, Risks &
    Limitations, Conclusion, Sources. Do not add a top-level "#" title.
  expected_output: >
    A complete Markdown report with the required sections. State that this is
    a calendar Q3 2026 comparison and identify the reporting period for each
    company because fiscal quarters differ. Include the source URLs. Do not
    add figures that conflict with the Researcher's CSV or evidence.
